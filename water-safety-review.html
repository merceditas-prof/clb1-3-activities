<html lang="en">
<head>
<meta charset="UTF-8">

<title>Being Safe in the Water - Review and Practice</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;

  }
  header {
    background: linear-gradient(90deg, #0f7ea3, #17a2b8);

  header p { margin: 0; font-size: 1em; opacity: 0.95; }

    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 18px auto 6px;
    max-width: 700px;
    padding: 0 12px;
  }
  .tab-btn {
    flex: 1;
    padding: 12px 10px;
    font-size: 1.05em;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    background: #d7ecf3;
    color: #0f7ea3;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: #0f7ea3;
    color: #ffffff;
    box-shadow: 0 3px 8px rgba(15,126,163,0.4);
  }

  .panel { display: none; max-width: 1000px; margin: 0 auto; padding: 10px 16px 50px; }
  .panel.active { display: block; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: 14px 0 18px;
  }
  .filter-pill {
    padding: 8px 16px;
    border-radius: 20px;
    border: 2px solid #0f7ea3;
    background: #ffffff;
    color: #0f7ea3;
    font-weight: 600;
    font-size: 0.9em;
    cursor: pointer;
  }
  .filter-pill.active {
    background: #0f7ea3;
    color: #ffffff;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 16px;
  }

  .card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.10);
    padding: 14px;
    text-align: center;
    border: 3px solid transparent;
  }
  .card.device { border-color: #f39c12; }
  .card.vocab { border-color: #17a2b8; }
  .card .icon-box { width: 96px; height: 96px; margin: 4px auto 8px; }
  .card .icon-box svg { width: 100%; height: 100%; }
  .card .term { font-size: 1.15em; font-weight: 700; margin-bottom: 6px; text-transform: capitalize; }
  .card .sentence { font-size: 0.88em; color: #45566b; line-height: 1.3; }

  .rule-row {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 20px;
    align-items: stretch;
  }
  .rule-card {
    flex: 1;
    min-width: 220px;
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    color: #ffffff;
  }
  .rule-card.always { background: linear-gradient(160deg, #27ae60, #1e8449); }
  .rule-card.never { background: linear-gradient(160deg, #e74c3c, #b03a2e); }
  .rule-card .tag { font-size: 0.85em; letter-spacing: 1px; text-transform: uppercase; opacity: 0.9; margin-bottom: 4px; }
  .rule-card .icon-box { width: 78px; height: 78px; margin: 6px auto 8px; background: rgba(255,255,255,0.15); border-radius: 50%; padding: 8px; }
  .rule-card .icon-box svg { width: 100%; height: 100%; }
  .rule-card .rule-text { font-size: 1.05em; font-weight: 700; }

  /* Quiz styles */
  .quiz-wrap { max-width: 640px; margin: 0 auto; text-align: center; }
  .quiz-stats {
    display: flex;
    justify-content: space-between;
    background: #ffffff;
    border-radius: 12px;
    padding: 10px 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 16px;
    font-weight: 700;
    color: #0f7ea3;
  }
  .quiz-card {
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    padding: 24px 20px;
  }
  .quiz-icon-box { width: 130px; height: 130px; margin: 0 auto 14px; }
  .quiz-icon-box svg { width: 100%; height: 100%; }
  .quiz-prompt { font-size: 1.2em; font-weight: 700; margin-bottom: 18px; }
  .quiz-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .quiz-options.two-col-wide { grid-template-columns: 1fr; }
  .opt-btn {
    padding: 14px 10px;
    font-size: 1.05em;
    font-weight: 600;
    border-radius: 12px;
    border: 2px solid #cfe3ea;
    background: #f5fbfd;
    color: #1b2a3a;
    cursor: pointer;
  }
  .opt-btn:hover { border-color: #0f7ea3; }
  .opt-btn.correct { background: #27ae60; border-color: #27ae60; color: #fff; }
  .opt-btn.wrong { background: #e74c3c; border-color: #e74c3c; color: #fff; }
  .opt-btn[disabled] { cursor: default; }

  .rule-btn.always { border-color: #27ae60; }
  .rule-btn.never { border-color: #e74c3c; }

  .feedback { margin-top: 14px; font-weight: 700; min-height: 24px; }
  .feedback.good { color: #1e8449; }
  .feedback.bad { color: #b03a2e; }

  .next-btn, .play-again-btn {
    margin-top: 16px;
    padding: 12px 24px;
    font-size: 1em;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    background: #0f7ea3;
    color: #ffffff;
    cursor: pointer;
  }

  .end-screen { text-align: center; padding: 30px 10px; }
  .end-screen .big-score { font-size: 2.4em; font-weight: 800; color: #0f7ea3; margin-bottom: 8px; }
  .end-screen .tier-msg { font-size: 1.15em; margin-bottom: 20px; }

  footer { text-align: center; padding: 18px; color: #6b7c8f; font-size: 0.85em; }
</style>
</head>

  { type: 'vocab', icon: 'wearVest', prompt: 'You cannot swim well. You should ____ a life jacket.', options: ['wear', 'take', 'dive'], answer: 0 },
  { type: 'vocab', icon: 'watchEye', prompt: 'Parents must always ____ their children near water.', options: ['watch', 'ignore', 'dive'], answer: 0 },
  { type: 'vocab', icon: 'turnBack', prompt: 'Never ____ on a child who is near water.', options: ['turn your back', 'smile', 'swim'], answer: 0 },
  { type: 'vocab', icon: 'aloneFigure', prompt: 'Never swim ____. Swim with a friend instead.', options: ['alone', 'together', 'fast'], answer: 0 },
  { type: 'vocab', icon: 'dangerousWater', prompt: 'Murky, cloudy water can be ____ water.', options: ['dangerous', 'safe', 'warm'], answer: 0 },
  { type: 'vocab', icon: 'safeWater', prompt: 'A clean pool with a lifeguard is ____ water.', options: ['safe', 'dangerous', 'deep'], answer: 0 }
];

/* ---------- RENDER STUDY CARDS ---------- */
function renderDevices() {
  const grid = document.getElementById('devicesGrid');
  grid.innerHTML = DEVICES.map(d => `
    <div class="card device">
      <div class="icon-box">${iconSvg(d.key)}</div>
      <div class="term">${d.name}</div>
    </div>
  `).join('');
}

function renderVocab() {
  const grid = document.getElementById('vocabGrid');
  grid.innerHTML = VOCAB.map(v => `
    <div class="card vocab">
      <div class="icon-box">${iconSvg(v.icon)}</div>
      <div class="term">${v.term}</div>
      <div class="sentence">${v.sentence}</div>
    </div>
  `).join('');
}

function renderRules() {
  const container = document.getElementById('rulesRows');
  const alwaysRules = RULES.filter(r => r.answer === 'always');
  const neverRules = RULES.filter(r => r.answer === 'never');
  let html = '<div class="rule-row">';
  for (let i = 0; i < alwaysRules.length; i++) {
    html += `
      <div class="rule-card always">
        <div class="tag">Always</div>
        <div class="icon-box">${iconSvg(alwaysRules[i].icon)}</div>
        <div class="rule-text">${alwaysRules[i].rule}</div>
      </div>
      <div class="rule-card never">
        <div class="tag">Never</div>
        <div class="icon-box">${iconSvg(neverRules[i].icon)}</div>
        <div class="rule-text">${neverRules[i].rule}</div>
      </div>
    `;
  }
  html += '</div>';
  container.innerHTML = html;
}

renderDevices();
renderVocab();
renderRules();

/* ---------- TABS ---------- */
function showTab(name) {
  document.getElementById('study').classList.toggle('active', name === 'study');
  document.getElementById('quiz').classList.toggle('active', name === 'quiz');
  document.getElementById('tabStudyBtn').classList.toggle('active', name === 'study');
  document.getElementById('tabQuizBtn').classList.toggle('active', name === 'quiz');
  if (name === 'quiz' && !quizStarted) startQuiz();
}

function filterStudy(which, btn) {
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  const dSec = document.getElementById('devicesSection');
  const vSec = document.getElementById('vocabSection');
  const rSec = document.getElementById('rulesSection');
  if (which === 'all') { dSec.style.display = ''; vSec.style.display = ''; rSec.style.display = ''; }
  if (which === 'devices') { dSec.style.display = ''; vSec.style.display = 'none'; rSec.style.display = 'none'; }
  if (which === 'vocab') { dSec.style.display = 'none'; vSec.style.display = ''; rSec.style.display = 'none'; }
  if (which === 'rules') { dSec.style.display = 'none'; vSec.style.display = 'none'; rSec.style.display = ''; }
}

/* ---------- QUIZ LOGIC ---------- */
let quizStarted = false;
let quizQuestions = [];
let quizIndex = 0;
let score = 0;
let streak = 0;
const ROUND_SIZE = 12;

function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildBank() {
  const bank = [];
  DEVICES.forEach(d => {
    const distractors = shuffleArr(DEVICES.filter(x => x.key !== d.key)).slice(0, 3).map(x => x.name);
    const options = shuffleArr([d.name, ...distractors]);
    bank.push({ type: 'device', icon: d.key, prompt: 'What is this called?', options, answer: options.indexOf(d.name) });
  });
  RULES.forEach(r => {
    bank.push({ type: 'rule', icon: r.icon, prompt: r.rule, options: ['Always', 'Never'], answer: r.answer === 'always' ? 0 : 1 });
  });
  VOCAB_QUESTIONS.forEach(v => {
    const options = shuffleArr(v.options.map((opt, i) => ({ opt, correct: i === v.answer })));
    bank.push({ type: 'vocab', icon: v.icon, prompt: v.prompt, options: options.map(o => o.opt), answer: options.findIndex(o => o.correct) });
  });
  return bank;
}

function startQuiz() {
  quizStarted = true;
  const bank = buildBank();
  quizQuestions = shuffleArr(bank).slice(0, ROUND_SIZE);
  quizIndex = 0;
  score = 0;
  streak = 0;
  renderQuestion();
}

function updateStats() {
  document.getElementById('statScore').textContent = 'Score: ' + score;
  document.getElementById('statStreak').textContent = 'Streak: ' + streak;
  document.getElementById('statProgress').textContent = 'Question ' + (quizIndex + 1) + ' / ' + quizQuestions.length;
}

function renderQuestion() {
  if (quizIndex >= quizQuestions.length) { renderEnd(); return; }
  updateStats();
  const q = quizQuestions[quizIndex];
  const area = document.getElementById('quizArea');
  const optClass = q.type === 'rule' ? 'quiz-options two-col-wide' : 'quiz-options';
  area.innerHTML = `
    <div class="quiz-card">
      <div class="quiz-icon-box">${iconSvg(q.icon)}</div>
      <div class="quiz-prompt">${q.prompt}</div>
      <div class="${optClass}" id="optWrap">
        ${q.options.map((o, i) => `<button class="opt-btn ${q.type === 'rule' ? (o === 'Always' ? 'rule-btn always' : 'rule-btn never') : ''}" onclick="answerQuestion(${i})">${o}</button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  `;
}

function answerQuestion(i) {
  const q = quizQuestions[quizIndex];
  const buttons = document.querySelectorAll('#optWrap .opt-btn');
  buttons.forEach(b => b.setAttribute('disabled', 'true'));
  const feedback = document.getElementById('feedback');
  if (i === q.answer) {
    buttons[i].classList.add('correct');
    score++;
    streak++;
    feedback.textContent = 'Correct!';
    feedback.className = 'feedback good';
  } else {
    buttons[i].classList.add('wrong');
    buttons[q.answer].classList.add('correct');
    streak = 0;
    feedback.textContent = 'Not quite. The correct answer is: ' + q.options[q.answer];
    feedback.className = 'feedback bad';
  }
  updateStats();
  const area = document.getElementById('quizArea');
  const nextBtn = document.createElement('button');
  nextBtn.className = 'next-btn';
  nextBtn.textContent = (quizIndex === quizQuestions.length - 1) ? 'See Results' : 'Next Question';
  nextBtn.onclick = () => { quizIndex++; renderQuestion(); };
  area.querySelector('.quiz-card').appendChild(nextBtn);
}

function renderEnd() {
  const area = document.getElementById('quizArea');
  const total = quizQuestions.length;
  let msg = '';
  const pct = score / total;
  if (pct === 1) msg = 'Perfect score! You know how to be safe in the water.';
  else if (pct >= 0.8) msg = 'Great work! You remember the water safety rules well.';
  else if (pct >= 0.5) msg = 'Good try! Review the Study Cards and play again.';
  else msg = 'Keep practicing! Look at the Study Cards, then try again.';
  area.innerHTML = `
    <div class="quiz-card end-screen">
      <div class="big-score">${score} / ${total}</div>
      <div class="tier-msg">${msg}</div>
      <button class="play-again-btn" onclick="startQuiz()">Play Again</button>
    </div>
  `;
  updateStats();
}
</script>
